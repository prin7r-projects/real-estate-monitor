services:
  landing:
    build:
      context: .
      dockerfile: Dockerfile.landing
    image: skyline-watch-landing:latest
    container_name: skyline-watch-landing
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.real-estate-monitor.rule=Host(`real-estate-monitor.prin7r.com`)"
      - "traefik.http.routers.real-estate-monitor.entrypoints=websecure"
      - "traefik.http.routers.real-estate-monitor.tls.certresolver=letsencrypt"
      - "traefik.http.services.real-estate-monitor.loadbalancer.server.port=3000"
